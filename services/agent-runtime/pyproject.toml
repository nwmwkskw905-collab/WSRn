[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-runtime"
version = "0.9.0"
description = "JARVIS local agent runtime: planning, tools, permissions, integrations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
windows = ["pywinauto>=0.6.8", "pywin32>=306", "pyperclip>=1.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
voice = ["faster-whisper>=1.0", "piper-tts>=1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
